{% load static %}
<div class="card card-modern shadow-sm border-0 mb-4">
    <div class="card-body p-3">
        <!-- Статистика портала (3 компактные плашки в ряд) -->
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold text-dark small">
                <i class="bx bx-pie-chart-alt text-primary me-1"></i>Статистика портала
            </span>
        </div>
        <div class="row g-2 mb-3">
            <div class="col-4">
                <a href="{% url 'hrdepartment_app:memo_list' %}" class="p-2 rounded bg-light border text-decoration-none text-center d-block card-stat-hover h-100" title="Служебные записки: {{ sp|default:'0' }} активных, {{ spf|default:'0' }} отменено">
                    <div class="fw-bold text-primary fs-5 lh-1">{{ sp|default:"0" }}</div>
                    <div class="text-muted text-truncate" style="font-size: 0.725rem;">Служ. зап.</div>
                </a>
            </div>
            <div class="col-4">
                <a href="{% url 'hrdepartment_app:bpmemo_list' %}" class="p-2 rounded bg-light border text-decoration-none text-center d-block card-stat-hover h-100" title="Бизнес-процессы: {{ bp|default:'0' }} активных, {{ bpf|default:'0' }} отменено">
                    <div class="fw-bold text-info fs-5 lh-1">{{ bp|default:"0" }}</div>
                    <div class="text-muted text-truncate" style="font-size: 0.725rem;">Процессы</div>
                </a>
            </div>
            <div class="col-4">
                <a href="{% url 'contracts_app:index' %}" class="p-2 rounded bg-light border text-decoration-none text-center d-block card-stat-hover h-100" title="Договоры в базе: {{ contract|default:'0' }}">
                    <div class="fw-bold text-success fs-5 lh-1">{{ contract|default:"0" }}</div>
                    <div class="text-muted text-truncate" style="font-size: 0.725rem;">Договоры</div>
                </a>
            </div>
        </div>

        <hr class="my-2">

        <!-- Проекты в работе (Компактный сворачиваемый блок) -->
        <div class="accordion accordion-flush" id="projectsAccordion">
            <div class="accordion-item border-0">
                <h6 class="accordion-header" id="headingProjects">
                    <button class="accordion-button collapsed p-0 bg-transparent shadow-none small fw-bold text-dark d-flex justify-content-between align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#collapseProjects" aria-expanded="false" aria-controls="collapseProjects">
                        <span><i class="bx bx-task text-primary me-1"></i>Проекты в работе</span>
                        <span class="badge bg-light text-muted border ms-auto me-2 font-weight-normal" style="font-size: 0.7rem;">3 проекта</span>
                    </button>
                </h6>
                <div id="collapseProjects" class="accordion-collapse collapse" aria-labelledby="headingProjects" data-bs-parent="#projectsAccordion">
                    <div class="accordion-body p-0 pt-2 small">
                        <div class="p-2 rounded bg-light border mb-1">
                            <div class="fw-bold text-dark d-flex align-items-center gap-1" style="font-size: 0.775rem;">
                                <span class="badge bg-danger rounded-circle p-1" style="width: 6px; height: 6px;"></span> Договоры
                            </div>
                            <div class="text-muted mt-1 ps-2" style="font-size: 0.725rem; line-height: 1.3;">Подгрузка файлов, «Ученические договора».</div>
                        </div>
                        <div class="p-2 rounded bg-light border mb-1">
                            <div class="fw-bold text-dark d-flex align-items-center gap-1" style="font-size: 0.775rem;">
                                <span class="badge bg-success rounded-circle p-1" style="width: 6px; height: 6px;"></span> Документация
                            </div>
                            <div class="text-muted mt-1 ps-2" style="font-size: 0.725rem; line-height: 1.3;">Должностные инструкции, рук. документы.</div>
                        </div>
                        <div class="p-2 rounded bg-light border">
                            <div class="fw-bold text-dark d-flex align-items-center gap-1" style="font-size: 0.775rem;">
                                <span class="badge bg-primary rounded-circle p-1" style="width: 6px; height: 6px;"></span> ЭДО
                            </div>
                            <div class="text-muted mt-1 ps-2" style="font-size: 0.725rem; line-height: 1.3;">Занятость квартир, логистика посылок.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
