{% load static %}

<div class="task-header-wrapper">
    <div class="task-header-info">
        <h4 class="task-page-title mb-0 font-weight-bold text-dark d-flex align-items-center">
            <i class="{{ header_icon|default:'bx bx-task' }} text-primary me-2 flex-shrink-0"></i>
            <span>{{ header_title }}</span>
        </h4>
        {% if header_subtitle %}
            <p class="text-muted small mb-0 d-none d-md-block">{{ header_subtitle }}</p>
        {% endif %}
    </div>
    <div class="task-view-switcher-group">
        <div class="task-segmented-nav" role="navigation" aria-label="Переключение представлений задач">
            <a href="{% url 'tasks_app:task-dashboard' %}"
               class="nav-item-btn {% if active_view == 'dashboard' %}active{% endif %}"
               title="Дашборд аналитики и метрик">
                <i class="bx bx-tachometer"></i>
                <span>Дашборд</span>
            </a>
            <a href="{% url 'tasks_app:task-kanban' %}"
               class="nav-item-btn {% if active_view == 'kanban' %}active{% endif %}"
               title="Канбан-доска Workflow">
                <i class="bx bx-columns"></i>
                <span>Канбан</span>
            </a>
            <a href="{% url 'tasks_app:task-list' %}"
               class="nav-item-btn {% if active_view == 'calendar' or active_view == 'list' %}active{% endif %}"
               title="Календарь задач и событий">
                <i class="bx bx-calendar"></i>
                <span>Календарь</span>
            </a>
            <a href="{% url 'tasks_app:task-discipline-report' %}"
               class="nav-item-btn {% if active_view == 'discipline' %}active{% endif %}"
               title="Отчет по исполнительской дисциплине">
                <i class="bx bx-bar-chart-square"></i>
                <span>Дисциплина</span>
            </a>
        </div>
        {% if show_create_btn|default:True %}
            <a href="{% url 'tasks_app:task-create' %}" class="btn btn-primary task-create-btn">
                <i class="bx bx-plus me-1"></i>
                <span>Создать поручение</span>
            </a>
        {% endif %}
    </div>
</div>
