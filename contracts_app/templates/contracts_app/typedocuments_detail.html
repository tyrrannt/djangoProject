{% extends 'customers_app/main.html' %}
{% load static %}
{% load custom %}

{% block title %}
    {{ title }} // КОРПОРАТИВНЫЙ ПОРТАЛ
{% endblock %}

{% block custom_css %}
    <style>
        :root {
            --touch-target-size: 44px;
        }

        .action-bar-responsive {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 24px;
            margin-bottom: 24px;
        }

        .btn-touch {
            min-height: var(--touch-target-size);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            font-weight: 600;
        }

        .field-label {
            font-size: 0.84rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 4px;
        }
    </style>
{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-12 col-lg-8">
            <div class="card card-modern shadow-sm border-0">
                <div class="card-header bg-light py-3">
                    <h5 class="card-title text-dark mb-0">
                        <i class="fas fa-folder-open text-primary me-2"></i>Просмотр: {{ object.type_document }}
                    </h5>
                </div>
                <div class="card-body p-3 p-md-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="field-label">Тип документа:</label>
                            <input type="text" class="form-control bg-light" value="{{ object.type_document }}" readonly>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="field-label">Краткое наименование:</label>
                            <input type="text" class="form-control bg-light" value="{{ object.short_name }}" readonly>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="field-label">Префикс файла:</label>
                            <input type="text" class="form-control bg-light" value="{{ object.file_name_prefix }}" readonly>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Нижняя панель действий -->
    <div class="action-bar-responsive">
        <a href="{% url 'contracts_app:typedocuments_update' object.pk %}" class="btn btn-success btn-touch" aria-label="Изменить" title="Изменить">
            <i class="bx bx-edit text-4 me-2"></i>
            <span>Изменить</span>
        </a>
        <a href="{% url 'contracts_app:typedocuments_list' %}" class="btn btn-outline-dark btn-touch" aria-label="К списку" title="Закрыть">
            <i class="bx bx-log-out-circle text-4 me-2"></i>
            <span>К списку</span>
        </a>
    </div>
{% endblock %}
